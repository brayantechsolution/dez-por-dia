name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'app/src/main/assets/words.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto do Xcode
        run: cd ios && xcodegen generate

      - name: Compilar para o simulador (sem assinatura)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project DezPorDia.xcodeproj -target DezPorDia \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
