name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'marketing/**'
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dez-por-dia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Salvar o APK no ramo "apk"
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/10-por-dia.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add 10-por-dia.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
