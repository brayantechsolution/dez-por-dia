# Projeto do app de iPhone. Gere o .xcodeproj com:  cd ios && xcodegen generate
name: DezPorDia
options:
  bundleIdPrefix: app.dezpordia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DezPorDia:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # O mesmo banco de 1.300 palavras do Android
      - path: ../app/src/main/assets/words.json
        buildPhase: resources
    dependencies:
      - target: DezPorDiaWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 10 por Dia
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/DezPorDia.entitlements
      properties:
        com.apple.security.application-groups: [group.app.dezpordia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dezpordia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DezPorDiaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: ../app/src/main/assets/words.json
        buildPhase: resources
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 10 por Dia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/DezPorDiaWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.dezpordia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dezpordia.widgets
        # O código compartilhado sabe que está na extensão (onde não dá para iniciar o cartão ao vivo)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
