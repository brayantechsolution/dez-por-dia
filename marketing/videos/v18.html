<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Vídeo 18 — Inglês do trabalho: meeting, deadline, schedule</title>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0F1B2D}</style>
<script src="lib.js"></script></head>
<body>
<script>
const DURATION = 15;
// palavras, traduções e frases (s/t) do words.json
const WS = [
  { w: 'meeting', pt: 'reunião', e: '👥', s: 'The meeting starts at nine.', t: 'A reunião começa às nove.',
    from: 'Chefe', fe: '👔', clock: '08:51' },
  { w: 'deadline', pt: 'prazo', e: '⏳', s: 'The deadline is next Monday, so check your schedule.', t: 'O prazo é na próxima segunda, então veja sua agenda.',
    from: 'Gerente', fe: '👩‍💼', clock: '11:20' },
  { w: 'schedule', pt: 'agenda, cronograma', e: '🗒️', s: 'Can we check the schedule before the meeting?', t: 'Podemos ver a agenda antes da reunião?',
    from: 'Colega', fe: '🧑‍💻', clock: '16:05' },
];
const W0 = 1.3, WL = 3.0, SUM = W0 + WL * 3, END = SUM + 2.2;   // SUM = 10.3, END = 12.5

const bg = el('div', `position:absolute;inset:0;background:${C.navy}`);

// celular com a tela de bloqueio do app
const ph = phone(240, 600, 600, 1272);
const ls = lockScreen(ph.screen, ph.w, ph.h);
ls.date.textContent = 'Qui, 26 de novembro';

// mensagem do trabalho (chat) acima do celular
const msg = el('div', `position:absolute;left:80px;right:80px;top:345px;padding:26px 34px;border-radius:34px;background:#1C2B44;
  box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 0 0 3px ${C.line};font-family:Inter;color:#fff;opacity:0`);
const head = el('div', `display:flex;align-items:center;gap:16px;font:700 32px Inter;color:${C.grey}`, '', msg);
const fEmoji = el('span', `font-family:'Noto Color Emoji';font-size:40px`, '', head);
const fName = el('span', ``, '', head);
el('span', `margin-left:auto;font:600 26px Inter;color:${C.grey};opacity:.8`, 'agora', head);
const body = el('div', `margin-top:12px;font:700 44px/1.25 Inter`, '', msg);

const caps = [
  [caption('3 palavras que todo mundo fala *no escritório*', 130), -0.4, W0 + WL - 0.1],
  [caption('Prazo é *deadline*', 160), W0 + WL + 0.1, W0 + WL * 2 - 0.1],
  [caption('E a agenda é *schedule* 🗓️', 160), W0 + WL * 2 + 0.1, SUM - 0.1],
  [caption('Quantas você *já usa?*', 330), SUM, END],
];

// resumo
const sum = el('div', `position:absolute;left:90px;right:90px;top:620px;font-family:Inter;opacity:0`);
const sumRows = WS.map(p => el('div', `display:flex;justify-content:space-between;align-items:center;padding:36px 0;border-bottom:2px solid ${C.line}`,
  `<span style="font:900 70px Inter;color:${C.lime}"><span style="font-family:'Noto Color Emoji';font-size:58px;margin-right:24px">${p.e}</span>${p.w}</span><span style="font:700 50px Inter;color:${C.grey}">${p.pt.split(',')[0]}</span>`, sum));

const end = endCard(document.body);

let key = -1;
function render(t) {
  for (const [c, a, b] of caps) popCaption(c, t, a, b);

  // gancho: celular e primeira mensagem já na tela no quadro 0
  const i = Math.min(2, Math.max(0, Math.floor((t - W0) / WL)));
  const r = t < W0 ? 0 : t - W0 - i * WL;
  if (key !== i) {
    const p = WS[i];
    ls.set(p, i + 1, i + 1, i);
    ls.clock.textContent = p.clock;
    fEmoji.textContent = p.fe; fName.textContent = p.from;
    body.innerHTML = p.s.replace(new RegExp(`\\b${p.w}\\b`, 'i'), m => `<span style="color:${C.lime}">${m}</span>`);
    bg.style.background = GROUNDS[i % GROUNDS.length];
    key = i;
  }
  const inWords = t < SUM;
  if (inWords) {
    // mensagem entra; depois o bloco da palavra aparece no celular
    const first = t < W0 + 0.8 && i === 0;   // a 1ª palavra já está na tela desde o quadro 0
    const mi = first ? 1 : out(prog(r, 0, 0.35));
    const mo = t < W0 ? 1 : 1 - prog(r, WL - 0.2, WL);
    msg.style.opacity = Math.min(mi, mo);
    msg.style.transform = `translateY(${(1 - mi) * -60}px)`;
    const bi = first ? 1 : out(prog(r, 0.3, 0.7));
    ls.block.style.opacity = bi;
    ls.block.style.transform = `translateY(${(1 - bi) * 40}px)`;
    ls.emoji.style.transform = `scale(${first ? 1 + 0.04 * Math.sin(t * 5) : 0.7 + 0.3 * back(prog(r, 0.2, 0.6))})`;
  }
  ph.body.style.opacity = inWords ? 1 : 1 - prog(t, SUM, SUM + 0.25);
  if (!inWords) msg.style.opacity = 0;

  if (t >= SUM) bg.style.background = C.navy;
  sum.style.opacity = win(t, SUM, END, 0.3);
  sumRows.forEach((rw, k) => {
    const q = out(prog(t, SUM + 0.15 + k * 0.15, SUM + 0.5 + k * 0.15));
    rw.style.opacity = q; rw.style.transform = `translateX(${(1 - q) * 100}px)`;
  });
  playEnd(end, t, END);
}
document.body.appendChild(end.root);
render(0);
</script>
</body></html>
