<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Vídeo 14 — A mesma palavra, outra frase</title>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B1422}</style>
<script src="lib.js"></script></head>
<body>
<script>
const DURATION = 15;
const D1 = [
  { w: 'meeting', pt: 'reunião', s: 'The meeting starts at nine.', t: 'A reunião começa às nove.', e: '👥' },
  { w: 'available', pt: 'disponível', s: 'Is the doctor available this afternoon?', t: 'O médico está disponível hoje à tarde?', e: '✅' },
  { w: 'schedule', pt: 'agenda, cronograma', s: 'Can we check the schedule before the meeting?', t: 'Podemos ver a agenda antes da reunião?', e: '🗒️' },
  { w: 'borrow', pt: 'pegar emprestado', s: 'Can I borrow your pen for a minute?', t: 'Posso pegar sua caneta emprestada por um minuto?', e: '🤝' },
  { w: 'reliable', pt: 'confiável', s: 'My old car is slow but reliable.', t: 'Meu carro velho é lento, mas confiável.',
    s2: 'Her husband is a reliable man.', t2: 'O marido dela é um homem confiável.', e: '🛡️' },
  { w: 'deliver', pt: 'entregar', s: 'They deliver pizza until midnight.', t: 'Eles entregam pizza até meia-noite.', e: '📦' },
  { w: 'improve', pt: 'melhorar', s: 'I want to improve my English this year.', t: 'Quero melhorar meu inglês este ano.', e: '📈' },
  { w: 'receipt', pt: 'recibo, comprovante', s: 'Can I have the receipt, please?', t: 'Pode me dar o comprovante, por favor?', e: '🧾' },
  { w: 'appointment', pt: 'consulta, horário marcado', s: 'I have a dentist appointment on Friday.', t: 'Tenho consulta no dentista na sexta.', e: '🗓️' },
  { w: 'figure out', pt: 'descobrir, entender', s: "I can't figure out how this works.", t: 'Não consigo entender como isso funciona.', e: '🧩' },
];

const ph = phone(240, 560, 600, 1272);
const ls = lockScreen(ph.screen, ph.w, ph.h);

// frase antiga que sai riscada (só no vídeo, para mostrar a troca)
const ghost = el('div', `position:absolute;left:70px;right:70px;top:1590px;text-align:center;font:600 44px/1.3 Inter;color:${C.grey};opacity:0`, '');
ghost.innerHTML = '<span style="text-decoration:line-through;text-decoration-thickness:4px">My old car is slow but reliable.</span><br><span style="color:#C6F432;font-weight:800">→ Her husband is a reliable man.</span>';

const caps = [
  [caption('Viu a palavra de manhã? À tarde ela volta numa *frase nova* 🔁', 170), 0.05, 3.0],
  [caption('Primeiro, as *10 palavras* do dia…', 200), 3.0, 6.3],
  [caption('Acabou? *Começa de novo.*', 230), 6.3, 7.6],
  [caption('*Mesma palavra*, frase diferente', 200), 7.6, 11.4],
  [caption('Outro contexto: a palavra *fixa* 🧠', 200), 11.4, 12.7],
];
const card = endCard(document.body);

let key = '';
function setLock(k, fn) { if (k !== key) { fn(); key = k; } }

function render(t) {
  for (const [c, a, b] of caps) popCaption(c, t, a, b);
  ph.body.style.transformOrigin = '50% 30%';
  ph.body.style.transform = `translateY(${(1 - out(prog(t, 0, 0.6))) * 260}px) scale(${1 + 0.03 * prog(t, 0.6, 12.7)})`;

  let popStart = 0, fast = false;
  if (t < 3.4) {
    setLock('r1', () => { ls.set(D1[4], 5, 5, 4); ls.clock.textContent = '08:42'; ls.date.textContent = 'Seg, 9 de novembro'; });
  } else if (t < 6.3) {
    const steps = [3.4, 3.9, 4.4, 4.9, 5.4];
    let i = 0; for (let j = 0; j < steps.length; j++) if (t >= steps[j]) i = j;
    const n = i + 6;
    setLock('d' + n, () => { ls.set(D1[n - 1], n, n, n - 1); ls.clock.textContent = ['10:42', '11:42', '12:42', '13:42', '14:20'][i]; });
    popStart = steps[i]; fast = true;
  } else if (t < 8.3) {
    // volta ao começo do dia, rodada de revisão
    setLock('r2a', () => { ls.set(D1[4], 5, 10, 4); ls.clock.textContent = '15:10'; });
    popStart = 6.3;
  } else {
    setLock('r2b', () => { ls.set(D1[4], 5, 10, 4, { round2: true }); ls.clock.textContent = '15:10'; });
    popStart = 8.3;
  }
  let pop = t < 3.4 ? 1 : out(prog(t, popStart, popStart + (fast ? 0.15 : 0.3)));
  ls.emoji.style.opacity = pop;
  ls.emoji.style.transform = `scale(${0.7 + 0.3 * back(t < 3.4 ? 1 : prog(t, popStart, popStart + (fast ? 0.25 : 0.5)))})`;
  if (t >= 8.3) {
    // só a frase troca: a antiga já saiu, a nova entra da direita
    ls.block.style.opacity = 1; ls.block.style.transform = 'none';
    const sp = out(prog(t, 8.3, 8.75));
    for (const e of [ls.sen, ls.senPt]) { e.style.opacity = sp; e.style.transform = `translateX(${(1 - sp) * 120}px)`; }
  } else if (t >= 7.8) {
    ls.block.style.opacity = 1; ls.block.style.transform = 'none';
    const so = out(prog(t, 7.8, 8.3));
    for (const e of [ls.sen, ls.senPt]) { e.style.opacity = 1 - so; e.style.transform = `translateX(${-so * 120}px)`; }
  } else {
    for (const e of [ls.sen, ls.senPt]) { e.style.opacity = 1; e.style.transform = 'none'; }
    ls.block.style.opacity = pop; ls.block.style.transform = `translateY(${(1 - pop) * 40}px)`;
  }
  const flash = win(t, 8.3, 9.3, 0.15);
  ls.chip.style.transformOrigin = '0 50%';
  ls.chip.style.transform = `scale(${1 + 0.25 * flash})`;

  // legenda de baixo comparando as duas frases
  const g = win(t, 9.0, 12.6, 0.3);
  ghost.style.opacity = g;
  ghost.style.transform = `translateY(${(1 - out(prog(t, 9.0, 9.4))) * 30}px)`;

  playEnd(card, t, 12.7);
}
render(0);
</script>
</body></html>
